schema_version: "1.0.0"

sources:
  personal-excel:
    path: 'C:\path\to\excel-workbooks'
    recursive: false
    include:
      - "*.xlsx"
      - "*.xlsm"
    ignore: []
    notes:
      root: 'C:\path\to\obsidian-vault\reference\entities\files\Excel'
      profile: tkn-obsidian-v1
      frontmatter_term_format: obsidian-link
      rename_adapter: report-only

sync:
  pull_preserves_user_metadata: true
  delete_missing_notes: false
  delete_missing_workbooks: false
  allow_source_rename: false
  max_extracted_text_chars: 12000

# Only explicit `context build` uses GenAI Bridge. Normal pull remains local.
# Connections/models/authentication: ~/.tkn/genai_bridge/config.yaml.
# Images always live in each proxy note's sibling img/ directory, with relative links.
generation:
  bridge_profile: codex-default
  overrides: {}
  # Example per-application override:
  # overrides:
  #   timeout_seconds: 600
  language: Japanese
  max_images: 24
  tile_width_points: 1200
  tile_height_points: 800
  overlap_points: 80
  image_dpi: 150
  max_cells: 10000
  max_objects: 10000
  max_input_chars: 200000
  max_workbook_mb: 100
