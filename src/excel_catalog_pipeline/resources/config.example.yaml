schema_version: "1.3.0"

sources:
  personal-excel:
    workbooks_dir: 'C:\path\to\excel-workbooks'
    recursive: false
    include:
      - "*.xlsx"
      - "*.xlsm"
    ignore: []
    notes:
      dir: 'C:\path\to\obsidian-vault\reference\entities\files\Excel'
      profile: tkn-obsidian-v1
      frontmatter_term_format: obsidian-link
      rename_adapter: report-only

# Local cover generation. `sheet` needs Windows + desktop Excel, but no AI.
# auto: reuse the last successful mode per workbook; new workbooks use embedded.
# Non-null values override saved per-workbook settings. null inherits saved settings.
cover:
  mode: auto  # auto, embedded, sheet
  sheet: null  # New sheet covers: first visible worksheet
  range: null  # New sheet covers: A1:Q50
  width: null  # New sheet covers: 2400 px (600-4000)

sync:
  pull_preserves_user_metadata: true
  delete_missing_notes: false
  delete_missing_workbooks: false
  allow_source_rename: false
  max_extracted_text_chars: 12000

# Optional `pull --context` uses GenAI Bridge. Plain pull remains local.
# Connections/models/authentication: ~/.tkn/genai_bridge/config.yaml.
# Evidence images live in the proxy note's sibling img/ directory.
generation:
  # Context profile bundle: built-in default-ja/default-en or a custom directory name.
  prompt_profile: auto
  # Ordered parent directories containing custom profile folders; first match wins.
  profile_dirs: []
  # Select an image-capable model in the shared profile.
  # Examples: claude-default, copilot-default, antigravity-default, local-vision, azure-quality.
  bridge_profile: codex-default
  overrides: {}
  # Example per-application override:
  # overrides:
  #   timeout_seconds: 600
  language: Japanese
  max_images: 24
  tile_width_points: 1200
  tile_height_points: 800
  overlap_points: 80
  image_dpi: 150
  max_cells: 10000
  max_objects: 10000
  max_input_chars: null  # Optional CLI limit on evidence JSON characters, excluding image bytes
  max_workbook_mb: 100
